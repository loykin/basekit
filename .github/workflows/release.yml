name: Release

# Tag format: v<semver>  (all packages released together at the same version)
# Examples:  v1.0.0  |  v1.0.0-dev.0  |  v1.0.0-alpha.1
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: pnpm -r exec npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Verify repository
        run: pnpm release:check

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: pnpm -r exec npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build
        run: pnpm build

      - name: Publish all packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ -(alpha|beta|dev|rc|next) ]]; then
            pnpm -r publish --no-git-checks --tag "${BASH_REMATCH[1]}"
          else
            pnpm -r publish --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          for pkg_dir in packages/*/; do
            npm pack "$pkg_dir" --pack-destination release-artifacts
          done
          cd release-artifacts && shasum -a 256 ./*.tgz > checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.tgz
            release-artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
